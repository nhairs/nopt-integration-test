[build-system]
requires = ["setuptools>=80", "setuptools-git-metadata==0.1.0.dev0"]
build-backend = "setuptools.build_meta"

[project]
name = "nopt-integration-test"
version = "0.1.2.dev3"
description = "TestPyPI-only integration fixture for nopt"
requires-python = ">=3.11"
authors = [{name = "Nicholas Hairs", email = "info+nopt@nicholashairs.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]

[project.urls]
GitHub = "https://github.com/nhairs/nopt-integration-test"

[dependency-groups]
dev = ["pytest>=8", "black", "pylint", "pyrefly", "validate-pyproject[all]", "tox>=4", "tox-uv", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nopt_integration_test = ["py.typed"]

[tool.setuptools-git-metadata]
packages = ["nopt_integration_test"]

[tool.black]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["useless-return"]

[tool.nopt]
repository = "testpypi"
testpypi-username = "nhairs-test"
github-release-types = ["dev", "pre", "final"]
