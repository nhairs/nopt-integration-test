[tox]
requires = tox>=4,tox-uv
envlist = py{311,312,313,314,315},pypy{311,312}

[testenv]
description = check the integration fixture package
dependency_groups = dev
commands = pytest tests {posargs}

[testenv:format]
dependency_groups = dev
commands = black src tests scripts

[testenv:lint]
dependency_groups = dev
commands =
    validate-pyproject pyproject.toml
    black --check --diff src tests scripts
    pylint -j 1 src
    pyrefly check src tests scripts
