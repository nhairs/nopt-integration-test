name: Integration scenarios
on:
  workflow_dispatch:
    inputs:
      nopt-requirement:
        description: 'Published nopt pin or nopt @ git+https://...@COMMIT'
        type: string
        default: nopt==0.1.0.dev0
        required: true
  workflow_call:
    inputs:
      integration-ref:
        description: 'Integration-repository commit matching the reusable workflow pin'
        type: string
        required: true
      nopt-requirement:
        type: string
        default: nopt==0.1.0.dev0
        required: false
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nhairs/nopt-integration-test
          ref: ${{ inputs.integration-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv sync --group dev
      - name: Install nopt under test
        env:
          NOPT_REQUIREMENT: ${{ inputs.nopt-requirement }}
        run: uv pip install "$NOPT_REQUIREMENT"
      - name: Run success and expected-failure checks without uploading
        run: uv run --no-sync python -m pytest tests --junitxml=scenario-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scenario-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: scenario-results.xml
          if-no-files-found: warn
          retention-days: 90
