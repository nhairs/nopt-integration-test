# Read the nopt pin from the tested ref so candidate pins leave this workflow unchanged.
name: Publish release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      nopt_requirement: ${{ steps.pin.outputs.requirement }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        run: |
          requirement=$(cat .nopt-requirement)
          if [[ -z "$requirement" || "$requirement" == *$'\n'* ]]; then
            echo "::error::.nopt-requirement must contain one requirement"
            exit 1
          fi
          printf 'requirement=%s\n' "$requirement" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uvx --from "$NOPT_REQUIREMENT" nopt ci-preflight
        env:
          GH_TOKEN: ${{ github.token }}
          NOPT_REQUIREMENT: ${{ steps.pin.outputs.requirement }}
  ci:
    needs: preflight
    uses: ./.github/workflows/test.yml
  build:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - id: build
        run: uvx --from "$NOPT_REQUIREMENT" nopt build --output "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
          NOPT_REQUIREMENT: ${{ needs.preflight.outputs.nopt_requirement }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: uvx --from "$NOPT_REQUIREMENT" nopt publish-release-preflight --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
          NOPT_REQUIREMENT: ${{ needs.preflight.outputs.nopt_requirement }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/release-bundle/dist/
          repository-url: https://test.pypi.org/legacy/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/dist/
          retention-days: 90
          if-no-files-found: warn
  github-release:
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: uvx --from "$NOPT_REQUIREMENT" nopt publish-github-release --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
          NOPT_REQUIREMENT: ${{ needs.preflight.outputs.nopt_requirement }}
