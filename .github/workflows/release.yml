# Keep the nopt version and action commit pins consistent across all jobs.
name: T0078 read-only rerun verification
on:
  push:
    tags: ['v0.1.2.dev10']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'nhairs/nopt-integration-test' && github.ref == 'refs/tags/v0.1.2.dev10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uvx --from 'nopt @ git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@3e578dfa72fab6e61520bf86c95e0d1b3a189777' nopt ci-preflight
        env:
          GH_TOKEN: ${{ github.token }}
  ci:
    needs: preflight
    uses: ./.github/workflows/test.yml
  build:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - id: build
        run: uvx --from 'nopt @ git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@3e578dfa72fab6e61520bf86c95e0d1b3a189777' nopt build --output "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - name: Stop before the read-only publish check on attempt 1
        if: github.run_attempt == 1
        run: |
          echo "T0078 intentional publish stop before the attempt-2 probe"
          exit 1
      - run: uvx --from 'nopt @ git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@3e578dfa72fab6e61520bf86c95e0d1b3a189777' nopt publish-release-preflight --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
